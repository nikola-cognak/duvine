version: '3'
services:
  php:
    build: docker/php
    expose:
      - '9000'
    depends_on:
      - mysql
    volumes:
      - ./:/var/www/duvine
      - ./docker/logs/php:/var/logs/php
      - ./docker/php/conf/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/conf/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini

  nginx:
    image: nginx:latest
    restart: always
    expose:
      - '80'
    ports:
      - '80:80'
    depends_on:
      - php
      - mysql
    volumes:
      - ./docker/nginx/sites-enabled/duvine.conf:/etc/nginx/conf.d/default.conf
      - ./docker/logs/nginx:/var/log/nginx
      - ./:/var/www/duvine

  mysql:
    image: mysql:5.7
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: Root654321!
      MYSQL_DATABASE: wp_duvine
      MYSQL_USER: duvine
      MYSQL_PASSWORD: Duvine2022!
    volumes:
      - /var/lib/mysql
      - ./docker/database/sql-scripts/duvine.sql:/docker-entrypoint-initdb.d/duvine.sql